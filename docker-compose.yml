version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seugarcom-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # Exemplo: se você preferir sobrepor por aqui
      # NODE_ENV: production
      MONGODB_URI: mongodb+srv://services_seugarcom:ucBb9Sc7pe9z4d2v@cluster0.ekde6b8.mongodb.net/
      PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: seugarcom-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
